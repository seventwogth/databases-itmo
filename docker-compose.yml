services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: .
    environment:
      DATABASE_URL: postgres://poker:poker@db:5432/poker?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
